[global]
pid = /home/container/run/php/php-fpm.pid
error_log = /dev/stderr
daemonize = no

[www]
user = container
group = container
listen = 127.0.0.1:9999
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 64
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
php_admin_value[disable_functions] = shell_exec
php_admin_flag[expose_php] = off
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[session.save_path] = /home/container/run/php/sessions
php_admin_value[session.gc_probability] = 5
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_value[post_max_size] = 512M
php_admin_value[upload_max_filesize] = 512M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 0
php_admin_value[max_input_time] = -1
