[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/home/container/run/supervisord.pid

[unix_http_server]
file=/home/container/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///home/container/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command=/opt/mariadb/bin/mariadbd --defaults-file=/home/container/etc/mariadb/my.cnf
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 -F -p /home/container/run/php -y /etc/php/8.5/fpm/php-fpm.conf -c /etc/php/8.5/fpm/php.ini
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/bin/caddy run --config /home/container/etc/caddy/Caddyfile
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
