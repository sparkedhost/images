name: Build games-bedrock

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "games/bedrock/*"
      - "games/spark-utils/spark-utils.sh"
      - .github/workflows/games-bedrock.yml

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    with:
      context: ./games
      file: ./games/bedrock/Dockerfile
      tags: ghcr.io/sparkedhost/images:games-bedrock
