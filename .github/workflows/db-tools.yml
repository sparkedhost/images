name: Build database tools

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "databases/db-tools/**"
      - .github/workflows/db-tools.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./databases/db-tools
          file: ./databases/db-tools/Dockerfile
          load: true
          tags: ghcr.io/sparkedhost/images:db-tools-test
      - run: docker run --rm --entrypoint /bin/sh ghcr.io/sparkedhost/images:db-tools-test /usr/local/bin/smoke-test
      - uses: docker/build-push-action@v6
        with:
          context: ./databases/db-tools
          file: ./databases/db-tools/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sparkedhost/images:db-tools
